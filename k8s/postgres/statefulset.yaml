# Postgres 17: one pod with a stable name (postgres-0) and its own disk (PVC data-postgres-0).
# StatefulSet, not Deployment: a database needs identity + storage that follow the pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: invest
  labels:
    app: postgres
spec:
  serviceName: postgres          # the headless Service that gives postgres-0 its DNS name
  replicas: 1                    # ONE writer. More replicas would NOT be a cluster: each gets its own empty disk.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false   # Postgres never calls the k8s API -> no token in the pod
      imagePullSecrets:
        - name: ghcr-pull                   # private mirror in our GHCR (ESO keeps this Secret in sync)
      securityContext:
        runAsUser: 70            # the `postgres` user in the alpine image
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70              # volumes (PVC + secret files) get group 70 so the DB can use them
      containers:
        - name: postgres
          # Mirror of docker.io/library/postgres:17-alpine@sha256:266d3c25… (Postgres 17.11, arm64)
          image: ghcr.io/jazsingh05/kind/postgres:17-alpine@sha256:a717692f944862397bd102c6abee9b3f7927adbf7ee5f3a93e50b65aea0c5396
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # *_FILE = read the value from a file, not from the env var itself.
            # Env vars leak into `ps e`, crash dumps and child processes; files don't.
            # The ADMIN (superuser) creates the cluster on first start.
            - name: POSTGRES_USER_FILE
              value: /run/secrets/postgres-admin/username
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-admin/password
            - name: POSTGRES_DB_FILE
              value: /run/secrets/postgres-admin/database
            - name: PGDATA                  # a subfolder, so the volume root can hold other files
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: admin-auth
              mountPath: /run/secrets/postgres-admin
              readOnly: true
            - name: app-auth                # read by the init script to create the app user
              mountPath: /run/secrets/postgres-app
              readOnly: true
            - name: initdb                  # first-start scripts (ConfigMap)
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Ready = "accepting connections", not just "process started".
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$(cat /run/secrets/postgres-admin/username)\""]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: admin-auth
          secret:
            secretName: postgres-admin     # created by ESO from Vault
            defaultMode: 0440              # owner root + group 70 (fsGroup) can read; nobody else
        - name: app-auth
          secret:
            secretName: postgres-app
            defaultMode: 0440
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0555              # scripts must be readable (and runnable) by uid 70
  volumeClaimTemplates:
    - metadata:
        name: data                         # -> PVC data-postgres-0
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
