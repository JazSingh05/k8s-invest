# Postgres credentials: Vault secret/invest/postgres -> Secret `postgres-auth`.
# Used by Postgres (to create the user on first start) AND by portfolio-api (to log in).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
  namespace: invest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: postgres-auth
    creationPolicy: Owner
  # dataFrom.extract = copy every field of the Vault entry as-is
  # (username, password, database) -> same key names in the Secret.
  dataFrom:
    - extract:
        key: invest/postgres
