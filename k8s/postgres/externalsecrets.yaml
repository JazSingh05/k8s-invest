# Two Postgres identities, both generated straight into Vault (nobody sees them):
#   postgres-admin  superuser. Only the Postgres container gets it (first-start setup).
#   postgres-app    least-privilege app user. Postgres gets it (to create the user) and
#                   portfolio-api gets it (to log in). The app never sees the admin password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: invest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: postgres-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: invest/postgres-admin    # username, password, database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app
  namespace: invest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: postgres-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: invest/postgres-app      # username, password, database
