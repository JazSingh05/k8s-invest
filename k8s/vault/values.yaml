# HashiCorp Vault, standalone, for local learning.
# Install: kubectl apply -f k8s/vault/namespace.yaml && helm install vault hashicorp/vault --version 0.34.1 -n vault -f k8s/vault/values.yaml
#
# Standalone = 1 replica, StatefulSet + PVC (file storage at /vault/data), so data
# survives `colima stop`. Starts SEALED after every restart -> unseal by hand.
# Listener has TLS disabled (chart default) -> in-cluster traffic is plaintext. OK for
# a laptop; production would put TLS on the listener.

server:
  standalone:
    enabled: true
  dataStorage:
    enabled: true
    size: 1Gi

  # Image from OUR GHCR (mirror of docker.io/hashicorp/vault@sha256:5be4978…, Vault 2.0.4, arm64),
  # pinned by digest. The chart renders "repository:tag", so the digest rides in the tag.
  # PUBLIC package: Vault is part of the bootstrap layer (ESO needs it before ghcr-pull exists).
  image:
    repository: ghcr.io/jazsingh05/kind/vault
    tag: "2.0.4@sha256:a46ff551c2405b8ba156d2383d13766af9c9b98a33eb54764f3e9dab53c874cb"

# The agent injector is Vault's OTHER way to deliver secrets (sidecar per pod).
# We're using External Secrets Operator instead, so leave it off.
injector:
  enabled: false
