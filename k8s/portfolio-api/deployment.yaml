# Step 2b, part 2: a Deployment — a controller that keeps N copies of a pod running.
# Delete a pod, crash a node: the Deployment notices desired != actual and makes a new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  namespace: invest
  labels:
    app: portfolio-api
spec:
  replicas: 2                   # desired state: always 2 pods
  selector:
    matchLabels:
      app: portfolio-api        # "the pods I own are the ones with this label"
  template:                     # the pod blueprint: same as our old pod.yaml's metadata + spec
    metadata:
      labels:
        app: portfolio-api      # MUST match the selector above, or the API rejects it
    spec:
      # Private GHCR package: kubelet authenticates with this docker-registry Secret
      # (read:packages-only token). ESO creates it from Vault (externalsecret-ghcr-pull.yaml).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: portfolio-api
          # Pinned by digest: the tag 0.2.0 can be moved to another image, the digest can't.
          image: ghcr.io/jazsingh05/portfolio-api:0.2.0@sha256:eb14e20754e84d952e996ac62b62233a9da5be88940e869cbaab8a0b67c265fc
          ports:
            - containerPort: 8000
          env:
            - name: HEADER_MAP_FILE           # app reads the column mapping from here
              value: /config/header-map.json
          volumeMounts:
            - name: header-map
              mountPath: /config               # whole directory, NOT subPath: subPath
              readOnly: true                   # mounts never receive ConfigMap updates
      volumes:
        - name: header-map
          configMap:
            name: portfolio-api-header-map     # configmap-header-map.yaml
