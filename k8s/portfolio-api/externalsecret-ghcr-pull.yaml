# Keeps Secret `ghcr-pull` (the Deployment's imagePullSecret) in sync with Vault
# secret/invest/ghcr-pull. Vault is the source of truth; this Secret is a copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: invest
spec:
  refreshInterval: 1m        # re-read Vault every minute (short for demos; ~1h is typical)
  secretStoreRef:
    kind: SecretStore
    name: vault
  # 1. What to fetch: two fields from one Vault entry.
  data:
    - secretKey: username
      remoteRef:
        key: invest/ghcr-pull
        property: username
    - secretKey: token
      remoteRef:
        key: invest/ghcr-pull
        property: token
  # 2. What to write: a docker-registry Secret, built from those fields.
  target:
    name: ghcr-pull
    creationPolicy: Owner    # ESO owns it: delete this ExternalSecret -> Secret is deleted too
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
