# Identity the invest namespace uses to log in to Vault (role invest-eso).
# ESO asks the API server for a short-lived token for this SA (audience "vault")
# and presents it to Vault. No pod runs as it; it only exists to be an identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: invest
automountServiceAccountToken: false
