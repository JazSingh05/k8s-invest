# How the invest namespace reaches Vault. Namespaced, so only ExternalSecrets in
# `invest` can use it (vs a ClusterSecretStore, usable from every namespace).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: invest
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200   # Service `vault` in namespace `vault`; plain HTTP (TLS off locally)
      path: secret                          # KV mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes             # Vault auth method path
          role: invest-eso
          # ESO mints a short-lived token for THIS SA (TokenRequest, audience vault)
          # and logs in with it. No static Vault credential anywhere.
          serviceAccountRef:
            name: eso-vault
            audiences:
              - vault
